# Production : docker compose up -d          (app + postgres + osrm)
# Dev local  : docker compose up -d postgres mailpit
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://triage:triage@postgres:5432/triage}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-} # requis en production — validé au démarrage de l'app
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Triage brûlés <noreply@iqmed.io>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@iqmed.io}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      RUN_MIGRATIONS_ON_BOOT: "1"
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nécessite les fichiers .osrm préparés dans le volume (voir scripts/osrm-prepare.sh)
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    command: osrm-routed --algorithm ch --max-table-size 10000 /data/algeria-latest.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"

  # Dev uniquement : boîte mail locale (UI sur http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
